version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexora_postgres
    environment:
      POSTGRES_DB: nexora_db
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_secret_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: nexora_redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: nexora_backend
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py seed_demo_data &&
             python backend/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-nexora-saas-enterprise-portfolio-key
      - DB_NAME=nexora_db
      - DB_USER=nexora_user
      - DB_PASSWORD=nexora_secret_pass
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.8-flash
    depends_on:
      - postgres
      - redis

  celery:
    build: .
    container_name: nexora_celery
    command: celery -A config worker -l info
    working_dir: /app/backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora_frontend
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
